name: E2E Kinderbetreuung-Lohn

on:
  push:
    branches-ignore: [main]
    paths:
      - 'kinderbetreuung-lohn/**'
      - 'build.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-kinderbetreuung.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kinderbetreuung-lohn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci
        working-directory: .

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kinderbetreuung-lohn/playwright-report/
          retention-days: 7
