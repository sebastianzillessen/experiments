name: Deploy Supabase Edge Functions

# On push to main, deploy any updated Edge Functions in supabase/functions/
# to the linked Supabase project. Requires the same secret used by
# supabase-migrate.yml:
#   - SUPABASE_ACCESS_TOKEN: personal access token from
#     https://supabase.com/dashboard/account/tokens
#
# Per-function runtime secrets (e.g. RESEND_API_KEY, INVITE_EMAIL_FROM,
# APP_URL) must be set on the project itself via:
#   supabase secrets set KEY=value --project-ref <ref>
# or in the Supabase dashboard. They are NOT managed by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tbknudbcgaarqixweizj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: List functions to deploy
        id: list
        run: |
          set -e
          mapfile -t fns < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
            -not -name '_*' -printf '%f\n' | sort)
          if [ "${#fns[@]}" -eq 0 ]; then
            echo "No functions to deploy."
            echo "fns=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Functions to deploy:\n'
          printf '  %s\n' "${fns[@]}"
          # Space-separated for the next step
          echo "fns=${fns[*]}" >> "$GITHUB_OUTPUT"
      - name: Deploy each function
        if: steps.list.outputs.fns != ''
        run: |
          set -e
          for fn in ${{ steps.list.outputs.fns }}; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done
