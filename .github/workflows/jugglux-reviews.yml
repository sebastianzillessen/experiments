name: Jugglux reviews export

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r jugglux-reviews-parser/requirements.txt

      - name: Scrape all reviews
        run: python jugglux-reviews-parser/scraper.py

      - name: Commit updated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jugglux-reviews-parser/data
          if git diff --cached --quiet; then
            echo "No review changes"
          else
            git commit -m "chore: update jugglux reviews export ($(date -u +%F))"
            git push
          fi
